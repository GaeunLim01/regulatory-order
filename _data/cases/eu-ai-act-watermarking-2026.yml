id: eu-ai-act-watermarking-2026
title: EU AI Act Article 50 watermarking obligation
status: draft
period: { from: 2024-08, to: }
jurisdiction: [EU]
actors:
  - name: European Commission
    role: Proposed and administers the AI Act; publishes guidance through the AI Office.
  - name: European Parliament and Council of the EU
    role: Co-legislators. Adopted the AI Act and, in 2026, the Digital Omnibus that reset part of this deadline.
  - name: National market surveillance authorities
    role: Primary enforcers of Article 50 in each member state.
  - name: AI Office
    role: Limited enforcement role, competent only where a provider's own general-purpose model underlies the system, or where the system is integrated into a very large online platform.
  - name: Providers of generative AI systems (general-purpose AI providers as a category)
    role: Addressees of the marking obligation for synthetic audio, image, video, and text output.
  - name: Deployers of AI systems
    role: Separate, narrower disclosure duties, e.g. informing users of a deepfake or of AI-generated text published on matters of public interest.

# --- Layer A, Classification ---------------------------------------------------
layer_a:
  object_type: access_data
  object_note: >
    The regulated object is AI-generated output itself, specifically whether it
    can be marked and detected as synthetic. Nothing physical moves; the
    obligation attaches to content at the moment it is generated and again at
    the moment a deployer presents it to a user.

  instability_conditions:
    - id: category_practice_mismatch
      side_a: "the category: content that is AI-generated or manipulated, which must be marked"
      side_b: "the practice: assistive editing that does not substantially alter deployer-provided input, which is exempted"
      note: >
        Article 50(2) does not extend the marking duty to systems performing an
        assistive function for standard editing, or that do not substantially
        alter input data or its semantics. Where the line between "generated"
        and "assisted" falls is unresolved in the text and is the live
        compliance question providers are working through.
    - id: object_opacity
      status: new_value          # third appearance in this library. see Q4.
      side_a: whether a given marking or watermarking scheme actually holds up
      side_b: a legal mandate that assumes marking is a solved technical problem
      note: >
        Reporting on the state of watermarking describes schemes that can be
        publicly defeated within months of adoption, in good faith, without the
        provider having done anything wrong. This is the third independent
        appearance of this condition in the library (after Anthropic v. DoW and
        Fable 5/Mythos 5), which pushes it past the two-appearance threshold
        schema.yml sets for a batch review. Still flagged rather than added.

  conditions_blank_reason:

# --- Layer B, Formation history -------------------------------------------------
layer_b:
  event_type: enactment
  formation_trace: not_applicable
  order_began_operating: 2026-08-02
  order_began_operating_note: >
    Recorded outside formation_trace, as a deviation. R1 collapses the whole
    formation_trace block to not_applicable for an Enactment, on the reasoning
    that there is no prior timeline to plot against. That holds here: nothing
    disputed produced Article 50. But the article still has a real, specific
    date on which it starts to bind, 2 August 2026, and a second, later date,
    2 December 2026, for the marking sub-duty specifically. Losing those dates
    to the sentinel would discard the one part of this case that is most
    exactly documented. See deviations.

# --- Layer C, Manifestation ------------------------------------------------------
layer_c:
  manifestation:
    - id: definitional_contest
      note: >
        Providers, deployers, and civil-society commentators apply different
        thresholds to what counts as a "substantial alteration" that triggers
        the marking duty, since the text names the exemption without defining
        the line.
    - id: boundary_drift
      note: >
        The AI Act entered into force 1 August 2024 (source: s1). The Digital
        Omnibus, a separate simplification package, cleared the Council 29 June
        2026, was published 24 July 2026, and entered into force 27 July 2026,
        six days before Article 50 was due to bind (source: s5, s6). It left
        the general transparency date at 2 August 2026 untouched but pushed the
        machine-readable marking sub-duty to its own later date, 2 December
        2026, with roughly a four-month grace period for systems already on the
        market (source: s7). One article, two applicable dates, set six days
        apart from the date the second one was set.
    - id: classification_decision
      note: whether output is AI-generated or manipulated is the entire content of the obligation.
    - id: documentation_systems
      note: >
        Acceptable marking techniques are listed rather than mandated:
        watermarks, metadata, cryptographic provenance methods, logging, and
        fingerprints, "as may be appropriate," left for providers to combine.

# --- Layer D, Distribution --------------------------------------------------------
layer_d:
  distribution:
    source: >
      The European Commission and co-legislators, as producers of the
      obligation; the Digital Omnibus process, as the actor that reset part of
      its timeline.
    bearer: >
      Generative AI providers as the named addressees of the marking duty, but
      the disclosure duty on deployers reaches every user in the EU who
      encounters a deepfake or AI-generated public-interest text, an unbounded
      population with no direct relationship to the providers who built the
      underlying models.
    bearer_type: [firm, diffuse]
    leverage: contested
    mechanisms:
      - { id: burden_displacement, note: the duty is written against providers, but deployers integrating a provider's model into their own product carry a separate, distinct disclosure duty of their own }
      - { id: downstream_propagation, note: enforcement runs primarily through national market surveillance authorities in each member state rather than a single EU body, so the same obligation is applied by as many authorities as there are member states }

# --- Layer E, Re-formation ----------------------------------------------------------
layer_e:
  reformation:
    responses: [product_redesign, lobbying]
    narrative: >
      Providers are reported to be combining several marking techniques at once
      rather than relying on one, since no single method currently meets the
      Act's standard on its own. The Digital Omnibus itself is a re-formation
      response at the field level: industry pressure over the compressed
      marking timeline fed into a legislative process that reset part of the
      schedule days before it would have applied, which is the re-formation
      loop the framework describes feeding into the next round of Layer B,
      observed here inside a single case rather than across two.
    contextual_amplification: []

# --- Measured fields ---------------------------------------------------------
measured:
  numeric:
    deadline_gap:
      value: 122
      source: s7
      note: >
        Gap between the general transparency date (2 August 2026) and the
        marking-specific date (2 December 2026), both inside the same article.
        Not the usual formal-date-versus-compliance-gate measurement; recorded
        because it is the clearest fixed interval in the record. See deviations.
    time_to_response: null
    enforcement_amplification_events: null
  narrative:
    financial_exposure:
      text: >
        Fines of up to fifteen million euros or three percent of total worldwide
        annual turnover, whichever is higher, for breaches of Article 50. No
        enforcement action has been reported as of this record; the applicable
        date has only just passed.
      basis: reported
      source: s4
    downstream_reach:
      text: >
        Every EU user who encounters AI-generated content from an in-scope
        system, described in sources as an unbounded population rather than a
        named list.
      source: s3

# --- Deviations --------------------------------------------------------------
deviations:
  - id: D13
    field: layer_b.formation_trace
    observed: >
      Article 50 is an Enactment with no prior dispute, which under R1 means
      formation_trace collapses to not_applicable. But it still has two
      specific, well-documented applicable dates, one of them set by a second
      piece of legislation days before the first took effect.
    why_it_does_not_fit: >
      R1 was written to stop a dispute timeline from being fabricated where
      none exists. It was not written with the case of an Enactment whose own
      effective date later gets moved by a second Enactment. Collapsing
      everything to the sentinel would erase that second event along with the
      timeline it was protecting against.
    workaround: >
      formation_trace kept as not_applicable per R1. order_began_operating
      recorded as a sibling field instead of nesting it inside formation_trace,
      with the Digital Omnibus dates carried in the Layer C boundary_drift note
      rather than as a markers timeline. Template may need a field for a known
      effective date that survives even when formation_trace is not_applicable.

  - id: D12
    field: measured.numeric.deadline_gap
    observed: >
      The interval recorded is between two applicable dates set for the same
      obligation, not between an announced date and an earlier real compliance
      gate.
    why_it_does_not_fit: >
      The field definition assumes a formal date and a separate, usually
      earlier, operative gate. Here both dates are formal and the later one is
      the operative one for the marking sub-duty specifically. Fourth distinct
      shape this field has taken across the library.
    workaround: Recorded as 122 with the shape noted rather than forced into the usual reading.

