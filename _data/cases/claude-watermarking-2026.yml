id: claude-watermarking-2026
title: Claude output marking under EU AI Act Article 50
status: draft
period: { from: 2024-08-01, to: }
jurisdiction: [EU, US]
actors:
  - name: European Parliament and Council of the EU
    role: >-
      Co-legislators. Adopted the AI Act, and in 2026 the Digital Omnibus that
      moved part of the Article 50 marking duty.
  - name: European Commission and the AI Office
    role: >-
      Administer the Act and the Article 50(2) Code of Practice on Transparency
      of AI-Generated Content.
  - name: Anthropic
    role: >-
      Provider of generative AI models and systems, and so subject to the
      Article 50(2) marking obligation where its systems or their outputs fall
      within the Act's territorial scope. Signatory to the Article 50(2) Code of
      Practice, which is a voluntary means of demonstrating compliance rather
      than the source of the duty. Chose to apply marking worldwide.
  - name: Google DeepMind
    role: >-
      Developer of SynthID, cited in reporting as a technical reference point
      for Anthropic's text marking. No primary statement from Anthropic naming
      SynthID-Text is held here. Not a party to the obligation.
  - name: Coalition for Content Provenance and Authenticity (C2PA)
    role: >-
      Maintainer of the open provenance-metadata standard used for file output.
      A standards body, not a regulator.
  - name: Claude users worldwide
    role: >-
      Not named in the obligation and not confined to the EU. Their output
      carries the mark. Some paying subscribers reported cancelling.
  - name: National market surveillance authorities
    role: Primary enforcers of Article 50 in each member state.

# --- Layer A, Classification ---------------------------------------------------
layer_a:
  object_type: access_data
  object_note: >
    The regulated object is generated output and whether its provenance can be
    read off it. Nothing physical moves. The duty attaches to the provider at
    the moment of generation, but the thing that carries the mark is text and
    files that leave the provider's surface and travel with the user.

  instability_conditions:
    - id: category_practice_mismatch
      side_a: "the category: a trigger tied to placing a system on the EU market, putting it into service in the EU, or using its output in the EU"
      side_b: "the practice: marking built at model level, applied wherever Claude is offered"
      note: >
        The Act's reach is wider than the provider's location and can follow
        output used in the EU, but it is still bounded. Nothing in Article 50 or
        the Code of Practice requires marking text generated for a user with no
        EU nexus. Anthropic implemented at model level rather than by region, so
        the mark appears whatever the surface and wherever the user is. The
        global reach was a provider's implementation choice, not a command.
    - id: object_opacity
      side_a: whether the mark does what its provider says it does
      side_b: users asked to accept that account without the implementation being published
      note: >
        Anthropic states that the text mark does not change the meaning,
        quality, or readability of a response, and that it carries no
        identifying information and cannot be traced to a person, organisation,
        or chat. It has not published the technical details of the
        implementation, so users cannot check either statement for themselves.
        The property at issue is behavioural and the evidence for it is held by
        one party.
  conditions_blank_reason:

# --- Layer B, Formation history -------------------------------------------------
layer_b:
  event_type: enactment
  formation_trace:
    summary: >
      Traced from the Act's entry into force to the point where the obligation
      reached people who are not its addressees. The order itself was not
      produced by a dispute. What this trace follows is the passage from an
      enacted duty to a provider's implementation of it, and from there to
      users with no relationship to the regulator.
    order_began_operating: 2026-08-02
    markers:
      - { date: 2024-08-01, note: Regulation (EU) 2024/1689, the AI Act, enters into force, source: s1 }
      - { date: 2026-06-29, note: Council gives final approval to the Digital Omnibus simplification package, source: s2 }
      - { date: 2026-07-27, note: Digital Omnibus enters into force, six days before Article 50 was due to bind, source: s3 }
      - { date: 2026-08-02, note: "Article 50 transparency obligations become applicable. A limited transition applies to the 50(2) marking duty only, and only for generative AI systems already on the market before this date, which must comply by 2 December 2026. Systems placed on the market from this date must mark from the outset. The deployer duties at 50(1), (3), and (4) were not moved", source: s3 }
      - { date: 2026-08-02, note: "Claude models launched on or after this date embed marking at launch. No transition applies to them. Anthropic described marking for models released earlier as still being added", source: s4 }
      - { date: 2026-08-10, note: Anthropic publishes a support article confirming that generated text carries an embedded watermark and generated files carry signed provenance metadata, applied worldwide, source: s4 }
      - { date: 2026-08-11, note: the decision is widely reported. Coverage records that marking applies globally rather than regionally and that file marking can be lost through format conversion, re-saving, or screenshots, source: s5 }
      - { date: 2026-08-12, note: user objection becomes visible on X and Reddit. Some paying subscribers report cancelling, source: s7 }
      - { date: 2026-08, note: Anthropic states it has not observed a statistically significant increase in cancellations following the announcement, source: s12 }

# --- Layer C, Manifestation ------------------------------------------------------
layer_c:
  manifestation:
    - id: boundary_drift
      note: >
        The perimeter moved without the legal text moving. The duty is drawn on
        placement on the EU market; the implementation reaches every Claude
        user anywhere. The party that moved the boundary is the addressee, not
        the regulator, and it moved it outward rather than resisting it.
    - id: definitional_contest
      note: >
        What counts as AI-generated is the whole content of the duty, and the
        objection users raised is a definitional claim rather than a procedural
        one. It is more specific than a complaint about labelling AI writing.
        Text a user wrote and then had Claude proofread, translate, or summarise
        can carry the mark, and the mark records that a model handled the
        passage rather than that a model wrote it. Readers, employers, and
        institutions may not hold that distinction. Anthropic resolved the
        question at model level: output from a supported model is marked,
        whatever the division of labour that produced it. Article 50(2) exempts
        systems performing an assistive function that does not substantially
        alter deployer-provided input, and where that line falls is not settled
        in the text.
    - id: classification_decision
      note: >
        Marking is applied per model rather than per output, so the operative
        classification is of the model and not of the thing generated.
    - id: documentation_systems
      note: >
        Two techniques, not one. Text carries an embedded statistical mark that
        biases word choice in a pattern detectable over enough content and
        survives copying and pasting; reporting connects it to SynthID-Text
        without a primary statement from Anthropic naming it. Files carry signed
        C2PA provenance metadata, for supported types reported as .svg, .png,
        and .jpg rather than for every format. Detection signals that a model
        handled the text, not that it authored it, and short or heavily edited
        passages may not register. The Code of Practice treats no single
        technique as sufficient on its own.
    - id: contractual_relations
      note: >
        The change reached existing subscribers through an update to a service
        they were already paying for rather than through anything renegotiated
        with them. Whether a meaningful opt-out or alternative path existed is
        not established here and would need the applicable terms.
    - id: deadlines
      note: >
        2 August 2026 for models launched from that date. Marking for models
        released earlier was described as in progress.

# --- Layer D, Distribution --------------------------------------------------------
layer_d:
  distribution:
    source: >
      The EU co-legislators produced the obligation and the Commission the code
      of practice under it. Anthropic produced the implementation and, separately,
      the decision about its geographic scope. The two are not the same act and
      only the first is a regulatory one.
    bearer: >
      Anthropic is the named addressee and carries the engineering and
      compliance cost. What the mark is carried in is user output: text and
      files that leave the service and travel into documents, submissions, and
      published work. That population is unbounded and mostly outside the
      jurisdiction that created the duty.
    bearer_type: [firm, diffuse]
    leverage: contested
    mechanisms:
      - id: burden_displacement
        note: >
          The obligation names providers. What it produces is a property of the
          user's work product, persisting after the text is reworked,
          reformatted, or folded into something else.
      - id: downstream_propagation
        note: >
          The text mark travels with copied text, so it reaches readers,
          employers, and institutions who were never party to anything, and
          reaches them at a moment the user does not choose.

# --- Layer E, Re-formation ----------------------------------------------------------
layer_e:
  reformation:
    responses: [product_redesign, contract_rewriting]
    narrative: >
      The provider-side response was to build marking at model level, to describe
      work on models released earlier as in progress, and to state publicly that
      the mark carries no identifying information and cannot be traced to a
      person, organisation, or chat. That statement is the provider's; the
      implementation and detector are not public, so it is not independently
      checkable from the record held here. The user-side response was public
      objection and some individual cancellations, with Anthropic stating it had
      not observed a statistically significant increase in them. Commentary
      raised a possible shift in the appeal of open-weight models, which carry no
      equivalent obligation because no provider is placing them on the market as
      a service; whether that shift occurred is not established here. Nothing in
      the record so far shows the obligation itself being revisited.
    contextual_amplification: []

# --- Measured fields ---------------------------------------------------------
measured:
  numeric:
    deadline_gap:
      value: 122
      shape: two_formal_dates
      source: s3
      note: >
        The interval between the two dates the marking duty carries: 2 August
        2026 for systems placed on the market from that date, and 2 December
        2026 for systems already on it. Both are statutory dates, and which one
        applies turns on when the system was placed on the market rather than on
        any preparation gate. An earlier draft of this case recorded the value
        as negative on the reading that Anthropic had complied ahead of a
        deadline; that reading was wrong, because no transition applied to the
        models it shipped marking with. See deviations.
    time_to_response:
      value: 0
      source: s4
      note: >
        Marking was operational for newly launched models on the day the duty
        applied to them. This records preparation before the date rather than a
        same-day response after it. The intervals that carry information here
        are on the user side: eight days from the applicable date to the support
        article, ten to visible objection. Neither belongs in this field, which
        is defined against the addressee. See deviations.
    enforcement_amplification_events: { value: null, scope: "No enforcement action reported under Article 50 as of this record" }
  narrative:
    financial_exposure:
      text: >
        Fines of up to fifteen million euros or three percent of total worldwide
        annual turnover, whichever is higher, for breaches of Article 50. No
        enforcement action has been reported. On the user side, individual
        cancellations were publicly reported and Anthropic stated it had not
        observed a statistically significant increase in cancellations. The
        record establishes visible objection and individual departures, not
        measurable churn.
      basis: reported
      source: s5
    downstream_reach:
      text: >
        Every user of a supported Claude model, worldwide, whose text or files
        leave the service. Described in the sources as global rather than as a
        named population.
      source: s5

# --- Deviations --------------------------------------------------------------
deviations:
  - id: D13
    field: layer_b.formation_trace
    observed: >
      Article 50 is an Enactment with no prior dispute, which under R1 would
      collapse formation_trace to not_applicable.
    why_it_does_not_fit: >
      R1 was written to stop a dispute timeline being fabricated where none
      exists. What this trace plots is not the production of the enactment but
      its passage into a provider's implementation and from there to users. That
      sequence is documented and dated, and the sentinel would discard it.
    workaround: >
      formation_trace populated with markers. The template may need to
      distinguish the formation of an order from its arrival, since R1 only
      addresses the first.
    resolved_in: r6
    resolution: R1 narrowed to exclude a fabricated dispute history rather than the whole block.

  - id: D12
    field: measured.numeric.deadline_gap
    observed: >
      The two dates are both statutory and neither is a preparation gate. Which
      one applies turns on when a system was placed on the market.
    why_it_does_not_fit: >
      The field assumes a published date and a separate, usually earlier,
      operative gate. Here there is no gate, only two effective dates for the
      same duty applied to different populations of system. Fifth distinct shape this field has
      taken across the library. Resolved in r6: the field now carries a required
      shape, and this case is recorded as two_formal_dates.
    workaround: >
      Recorded as 122 with the shape stated. An earlier draft recorded it as
      negative on a misreading of who the transition applied to; the correction
      is noted in the field itself so the error stays visible.
    resolved_in: r6
    resolution: deadline_gap now carries a required shape; this case is two_formal_dates.

  - id: D14
    field: measured.numeric.time_to_response
    observed: >
      The provider was compliant on the applicable date itself, having prepared
      beforehand.
    why_it_does_not_fit: >
      The field measures from an order taking effect to the first documented
      response, which assumes the response follows. Where an addressee prepares
      in advance the value collapses to zero and stops carrying information.
    workaround: >
      Recorded as zero. The user-side intervals, eight and ten days, are held in
      the note rather than in the field, because the field is defined against the
      addressee and the users are not the addressee.

