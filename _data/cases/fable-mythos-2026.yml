id: fable-mythos-2026
title: Fable 5 and Mythos 5 export control directive
status: draft
period: { from: 2026-06-09, to: 2026-07-01 }
jurisdiction: [US]
actors:
  - name: Anthropic
    role: Addressee of the directive. Executed the shutdown.
  - name: US Department of Commerce
    role: Issued the directive and lifted it.
  - name: Howard Lutnick
    role: Commerce Secretary. Signed both the directive and the two lifting letters.
  - name: Amazon
    role: Source of the vulnerability report. Its CEO is reported to have alerted officials.
  - name: Enterprise customers
    role: Finance, healthcare, SaaS, critical infrastructure. Lost service without notice.
  - name: Cloud platforms
    role: AWS Bedrock, Google Cloud, Microsoft Foundry, Snowflake, Box, and the direct APIs.
  - name: NSA
    role: Was using the current Mythos build and was cut off by the order.
  - name: Signatories of the Open Letter on Transparent AI Cyber Protections
    role: Information-security leaders who published at freefable.org on 14 June.

# --- Module 1, Instability ---------------------------------------------------
module_1:
  object_type: access_data
  object_note: >
    The controlled thing is access to a model, and the control is drawn on the
    nationality of whoever is accessing it rather than on the model or on where it
    sits. Nothing physical moves.

  instability_conditions:
    - id: object_opacity
      status: new_value          # second appearance. see Q4.
      side_a: what the model can be made to do, knowable only by trying
      side_b: a control decision that had to be made in three days
      note: >
        The entire dispute is over whether a reported bypass of Fable 5's
        safeguards was severe enough to warrant control. Researchers claimed they
        could get the model to identify exploitable software flaws; Anthropic
        disputed the significance; a White House adviser said the company had
        refused to fix it. Nobody could settle it by inspection, because the
        property in question is behavioural. The resolution when it came was not a
        finding about the model but an undertaking about process: Anthropic agreed
        to proactively detect and address security risks, and the licence
        requirement went away.
    - id: category_practice_mismatch
      side_a: an export control drawn on the nationality of the recipient
      side_b: undifferentiated API access across dozens of cloud platforms
      note: >
        The category presumes recipients can be identified and separated. Anthropic
        said filtering by nationality in real time across its distribution was not
        possible, and so complied by shutting the models off for everyone. A rule
        about some users was executable only as a rule about all users. This is the
        same shape as the EU watermarking case: the category and the practice are
        drawn on different things.
    - id: speed_mismatch
      side_a: a model that ships and is globally live within hours
      side_b: an export review that ran for eighteen days afterwards
      note: >
        The models launched on 9 June and were live worldwide immediately. The
        review that decided whether they should be began on 12 June and concluded
        on 30 June. The order of operations is the mismatch.

  conditions_blank_reason:
  conditions_note: >
    jurisdictional_overlap does not fire. The directive reaches every foreign
    national anywhere on earth, but only one authority is asserting and no other
    contests it. Worldwide reach and overlapping claims are different things, and
    the vocabulary currently has a value only for the second.

  firm_traces:
    - id: boundary_drift
      note: >
        Who was covered moved three times in eighteen days. All foreign nationals
        on 12 June, then about a hundred vetted organisations regained Mythos 5 on
        26 June while Fable 5 stayed restricted, then everyone on 30 June. The
        underlying authority cited did not change across any of it.
    - id: definitional_contest
      note: >
        What counts as a jailbreak severe enough to justify control. The reporting
        researchers, the company, and the administration each applied a different
        threshold to the same finding.
    - id: competing_clocks
      note: >
        Enterprise contracts and their force majeure clauses run on fixed terms and
        did not anticipate an instantaneous government-mandated cutoff of a live
        service.

# --- Module 2, Formation history ---------------------------------------------
module_2:
  event_type: dispute
  formation_trace:
    summary: >
      Traced backward from the lifting. There was prior authority but no published
      rule saying frontier model access by foreign nationals required a licence.
      The directive created the obligation, the standoff set its terms, and the
      lifting letter recorded the settlement: no licence required, given an
      undertaking to detect and address security risks. The boundary was formed
      through the dispute rather than applied by it.
    order_began_operating: 2026-06-12
    markers:
      - { date: 2026-06-09, note: Fable 5 and Mythos 5 released. Fable 5 is the first publicly available Mythos-class model; Mythos 5 is the Project Glasswing build with some cyber safeguards removed, source: s1 }
      - { date: 2026-06-12, note: "Commerce Secretary's directive to the CEO citing national security authorities; suspension executed at 17:21 ET across all platforms", source: s2 }
      - { date: 2026-06-13, note: company statement published, disputing the severity of the reported bypass and describing the order as a misunderstanding, source: s3 }
      - { date: 2026-06-14, note: Open Letter on Transparent AI Cyber Protections published at freefable.org, asking that the directives be lifted and setting out four principles for AI risk regulation, source: s4 }
      - { date: 2026-06-26, note: partial lift. About one hundred trusted organisations regain Mythos 5 on a finding that appropriate safeguards are in place. Fable 5 restrictions kept, source: s5 }
      - { date: 2026-06-30, note: "full lift. Secretary's letter states no export licence is required, the company having agreed to proactively detect and address security risks", source: s6 }
      - { date: 2026-07-01, note: access restored, source: s3 }

# --- Module 3, Downstream ----------------------------------------------------
module_3:
  transmission_channels:
    - { id: classification_decision, note: the models were treated as controlled items, which is the whole of the order }
    - { id: deadlines, note: none. The directive was effective on receipt and the suspension ran the same evening }
    - { id: contractual_relations, note: the order reached customers through their service agreements, and force majeure language written for other kinds of interruption did not cover it }
    - { id: supply_chain_position, note: arrival differed by platform. Bedrock, Google Cloud, Foundry, Snowflake, Box, and direct API users lost the models simultaneously but through different vendors }
    - { id: access_restriction, note: the order is an access decision and nothing else. Other Claude models were unaffected }

  distribution:
    source: >
      Commerce, as the actor issuing the directive. Amazon supplied the finding it
      rested on.
    bearer: >
      Anthropic as addressee, but the consequence landed on everyone downstream of
      it: named enterprise customers in finance, healthcare, SaaS, and critical
      infrastructure, an unbounded population of public users, and the NSA, which
      was using the build the order cut off.
    bearer_type: [firm, diffuse]   # both at once. see D8.
    leverage: contested
    mechanisms:
      - { id: burden_displacement, note: the directive named one company; the cost fell on customers who had no part in the dispute and no way to contest it }
      - { id: downstream_propagation, note: reached six named distribution platforms and everything built on them within hours }

  reformation:
    responses: [product_redesign, supply_chain_restructuring, lobbying]
    sources: [s4, s6]
    narrative: >
      The settlement was an undertaking rather than a fix: the company agreed to
      proactively detect and address security risks, and the licence requirement
      was dropped. On the customer side the visible response was to diversify model
      dependencies, which is re-formation by the bearers rather than by the
      addressee. The open letter is a third form again, a coalition of outside
      practitioners lobbying on the burdened firm's side while asking for rules
      that would constrain the next such order.
    contextual_amplification:
      - note: >
          Competition with Chinese open-source developers is reported to have
          shaped the reversal, on the argument that the freeze handed them time.
          Background geopolitical conditions raising the stakes on an order already
          in place, which is what 3.3 describes. First case in the library where
          this fires.
        source: s6

# --- Measured fields ---------------------------------------------------------
measured:
  numeric:
    deadline_gap:
      value: 0
      source: s2
      note: >
        No preparation gate. The directive was effective on receipt and the
        suspension ran the same evening. Third distinct shape for this field across
        three cases, see D9.
    time_to_response: { value: 0, source: s3, note: "directive and shutdown the same evening; public statement within a day" }
    enforcement_amplification_events:
      value: 0
      source: s6
      note: >
        No investigation, penalty, or comparable-case citation followed. Window is
        the eighteen days to the lifting plus the period since.
  narrative:
    financial_exposure:
      text: >
        No figure published. What is documented is the shape rather than the size:
        enterprise clients across finance, healthcare, SaaS, and critical
        infrastructure lost a live service without notice or recourse, and the
        argument that carried weight in reversing the order was competitive rather
        than contractual, that the freeze advantaged rivals abroad.
      basis: reported
      source: s6
    downstream_reach:
      text: >
        Six named distribution platforms and everything built on them, plus the
        NSA. Beyond the named enterprises the affected population is every user of
        two models on general release, which cannot be enumerated.
      source: s2

# --- Deviations --------------------------------------------------------------
deviations:
  - id: D8
    field: 3.2 bearer_type
    observed: >
      The burden fell simultaneously on identifiable firms with contracts, on a
      federal agency, and on an unbounded population of public users.
    why_it_does_not_fit: >
      bearer_type is exactly_one. The value was added after the EU watermarking
      case on the assumption that a bearer is either nameable or diffuse. A case
      can be both, and here the two groups had different recourse: the enterprises
      had contracts to point at, the public users had nothing.
    workaround: Recorded as a list. The field may need to become multi-select.

  - id: D9
    field: measured.numeric.deadline_gap
    observed: >
      Zero. The order was effective on receipt with no notice period at all.
    why_it_does_not_fit: >
      Across three cases the field has now produced three different shapes: a gap
      that could not be measured because no gate was published, a gap running the
      wrong way because the operative date fell later than the announced one, and
      zero because there was no interval to measure. The definition assumes an
      interval exists and runs one way.
    workaround: >
      Recorded as 0. Reinforces D6. The field needs either a direction or a
      companion field saying which kind of gap it is.

