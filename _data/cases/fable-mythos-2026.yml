id: fable-mythos-2026
title: Fable 5 and Mythos 5 export control directive
status: draft
period: { from: 2026-06-09, to: 2026-07-01 }
jurisdiction: [US]
actors:
  - name: Anthropic
    role: Addressee of the directive. Executed the shutdown.
  - name: US Department of Commerce
    role: >-
      Issued the directive and lifted it. Practitioner analysis identifies the
      authorities relied on as ECRA section 4817(b)(1), covering interim
      controls on emerging technologies essential to national security, and
      EAR section 744.22(b), covering licence-requirement notifications where
      there is unacceptable risk of diversion to a military-intelligence end
      use or user in a country of concern. No ECCN for the models themselves is
      cited in the record held.
  - name: Howard Lutnick
    role: Commerce Secretary. Signed both the directive and the two lifting letters.
  - name: Amazon
    role: Source of the vulnerability report. Its CEO is reported to have alerted officials.
  - name: Enterprise customers
    role: Finance, healthcare, SaaS, critical infrastructure. Lost service without notice.
  - name: Cloud platforms
    role: AWS Bedrock, Google Cloud, Microsoft Foundry, Snowflake, Box, and the direct APIs.
  - name: US national security agencies
    role: >-
      Reported users of Mythos 5 under Project Glasswing and cut off by the
      order. No primary source held here names a specific agency.
  - name: Legion LegalTech Corp
    role: >-
      Anthropic customer. Sued the United States over the 12 June directive and
      dismissed the action voluntarily once the controls were lifted.
  - name: Signatories of the Open Letter on Transparent AI Cyber Protections
    role: >-
      Executives and technical leaders from the United States and allied
      countries who published at freefable.org on 14 June, calling for the
      directives to be lifted and for a transparent, scientific process for
      assessing AI risk.

# --- Layer A, Classification ---------------------------------------------------
layer_a:
  object_type: access_data
  object_note: >
    The controlled thing is access to a model, and the control is drawn on the
    nationality of whoever is accessing it rather than on the model or on where it
    sits. Nothing physical moves.

  instability_conditions:
    - id: object_opacity
      side_a: what the model can be made to do, knowable only by trying
      side_b: a control decision that had to be made in three days
      note: >
        The property at issue is what the model can be got to do, which no
        inspection settles. Anthropic reports running an external bug bounty of
        more than a thousand hours before release without finding a universal
        jailbreak, and zero compliance with harmful single-turn cyber requests
        across thirty published jailbreak techniques. The technique that triggered
        the directive was found afterwards, by a third party. Neither side could
        close the question by looking at the model: Anthropic disputed the
        significance of the finding, a White House adviser said the company had
        refused to fix it, and the demonstration itself was a single prompting
        method. The resolution, when it came, was not a finding about the model but
        a change to the process around it. Anthropic trained a classifier targeting
        the reported technique and rerouting flagged requests to a weaker model,
        and the restriction was lifted.
    - id: category_practice_mismatch
      side_a: an export control drawn on the nationality of the recipient
      side_b: undifferentiated API access across dozens of cloud platforms
      note: >
        The category presumes recipients can be identified and separated. Anthropic
        said filtering by nationality in real time across its distribution was not
        possible, and so complied by shutting the models off for everyone. A rule
        about some users was executable only as a rule about all users. This is the
        same shape as the EU watermarking case: the category and the practice are
        drawn on different things.
    - id: speed_mismatch
      side_a: a model that ships and is globally live within hours
      side_b: an export review that ran for eighteen days afterwards
      note: >
        The models launched on 9 June and were live worldwide immediately. The
        review that decided whether they should be began on 12 June and concluded
        on 30 June. The order of operations is the mismatch.

  conditions_blank_reason:
  conditions_note: >
    jurisdictional_overlap does not fire. The directive reaches every foreign
    national anywhere on earth, but only one authority is asserting and no other
    contests it. Worldwide reach and overlapping claims are different things, and
    the vocabulary currently has a value only for the second.

# --- Layer B, Formation history -------------------------------------------------
layer_b:
  event_type: dispute
  formation_trace:
    summary: >
      Traced backward from the lifting. There was prior authority but no published
      rule saying frontier model access by foreign nationals required a licence.
      The directive created the obligation, the standoff set its terms, and the
      lifting letter recorded the settlement: no licence required, given an
      undertaking to detect and address security risks. The boundary was formed
      through the dispute rather than applied by it.
    order_began_operating: 2026-06-12
    markers:
      - { date: 2026-06-09, note: "Fable 5 and Mythos 5 released. Fable 5 is the generally available version, carrying cybersecurity, biology, and chemistry safeguards that defer flagged queries to a weaker model; Mythos 5 went to a limited set of trusted Project Glasswing partners for defensive cybersecurity work", source: s1 }
      - { date: 2026-06-12, note: "Commerce Secretary's directive to the CEO citing national security authorities. Anthropic records receiving it at 17:21 ET and suspended access across all platforms the same evening. A later lawsuit alleged the government allowed about ninety minutes to comply; that figure is a pleading and is not confirmed in the record held", source: s2 }
      - { date: 2026-06-13, note: company statement published, disputing the severity of the reported bypass and describing the order as a misunderstanding, source: s3 }
      - { date: 2026-06-14, note: Open Letter on Transparent AI Cyber Protections published at freefable.org, asking that the directives be lifted and setting out four principles for AI risk regulation, source: s4 }
      - { date: 2026-06-23, note: Legion LegalTech Corp files suit against the United States over the directive, pleading violations of ECRA, the EAR, IEEPA, and the APA, source: s7 }
      - { date: 2026-06-26, note: partial lift. About one hundred trusted organisations regain Mythos 5 on a finding that appropriate safeguards are in place. Fable 5 restrictions kept, source: s5 }
      - { date: 2026-06-30, note: "full lift. Secretary's letter states no export licence is required, the company having agreed to proactively detect and address security risks", source: s6 }
      - { date: 2026-07-01, note: access restored, source: s3 }
      - { date: 2026-07-03, note: "Legion LegalTech voluntarily dismisses its action. The court record carries 3 July; Reuters reported it on 6 July", source: s7 }

# --- Layer C, Manifestation (merged r4 firm_traces + transmission_channels) -----
layer_c:
  manifestation:
    - id: boundary_drift
      note: >
        Who was covered moved on two axes at once, three times in eighteen days.
        The 12 June directive drew the line on nationality: all access by any
        foreign national, inside or outside the United States, including
        Anthropic's own foreign national employees. On 26 June the line was redrawn
        as an organisation set, about a hundred vetted US bodies for Mythos 5 only,
        and the nationality restriction was lifted for staff at those
        organisations and for Anthropic's own non-American employees. On 30 June
        both restrictions went. The underlying authority cited did not change
        across any of it.
    - id: definitional_contest
      note: >
        What counts as a jailbreak severe enough to justify control. The finding
        was one demonstration, and three parties read it three ways. Amazon
        researchers reported a prompting method that got Fable 5 to identify
        software vulnerabilities and, in one instance, to produce code showing how
        one could be exploited. Anthropic reviewed the demonstration, described the
        vulnerabilities as previously known and minor, and later reported that
        Opus 4.8, GPT-5.5, and Kimi K2.7 could find the same ones without any
        bypass; it classed the behaviour as routine defensive security work. The
        government and the reporting party treated it as grounds for an immediate
        worldwide control. The directive itself gave no specifics of the national
        security concern.
    - id: competing_clocks
      note: >
        Enterprise contracts and their force majeure clauses run on fixed terms and
        did not anticipate an instantaneous government-mandated cutoff of a live
        service.
    - id: classification_decision
      note: the models were treated as controlled items, which is the whole of the order
    - id: deadlines
      note: none. The directive was effective on receipt and the suspension ran the same evening
    - id: contractual_relations
      note: the order reached customers through their service agreements, and force majeure language written for other kinds of interruption did not cover it
    - id: supply_chain_position
      note: arrival differed by platform. Bedrock, Google Cloud, Foundry, Snowflake, Box, and direct API users lost the models simultaneously but through different vendors
    - id: access_restriction
      note: the order is an access decision and nothing else. Other Claude models were unaffected

# --- Layer D, Distribution -------------------------------------------------------
layer_d:
  distribution:
    source: >
      Commerce, as the actor issuing the directive. Amazon supplied the finding it
      rested on.
    bearer: >
      Anthropic as addressee, but the consequence landed on everyone downstream of
      it: named enterprise customers in finance, healthcare, SaaS, and critical
      infrastructure, an unbounded population of public users, and the national
      security users of the Mythos build the order cut off.
    bearer_type: [firm, diffuse]   # multi-select since r6
    leverage: contested
    mechanisms:
      - { id: burden_displacement, note: the directive named one company; the cost fell on customers who had no part in the dispute and no way to contest it }
      - { id: downstream_propagation, note: reached six named distribution platforms and everything built on them within hours }

# --- Layer E, Re-formation ---------------------------------------------------------
layer_e:
  reformation:
    responses: [product_redesign, supply_chain_restructuring, lobbying]
    sources: [s4, s6]
    narrative: >
      The settlement was an undertaking rather than a fix: the company agreed to
      proactively detect and address security risks, and the licence requirement
      was dropped. On the customer side the visible response was to diversify model
      dependencies, which is re-formation by the bearers rather than by the
      addressee. The open letter is a third form again, a coalition of outside
      practitioners lobbying on the burdened firm's side while asking for rules
      that would constrain the next such order.
    contextual_amplification:
      - note: >
          Competition with Chinese open-source developers was described in
          reporting as a background factor in the reversal, on the argument that
          the freeze handed them time. The lifting letters themselves turn on
          safeguards and risk management rather than on competition, so this is
          recorded as reported context and not as the stated ground.
        source: s6

# --- Measured fields ---------------------------------------------------------
measured:
  numeric:
    deadline_gap:
      value: 0
      shape: no_gate
      source: s2
      note: >
        No preparation gate. The directive was effective on receipt and the
        suspension ran the same evening. Third distinct shape for this field across
        three cases, see D9.
    time_to_response: { value: 0, source: s3, note: "directive and shutdown the same evening; public statement within a day" }
    enforcement_amplification_events:
      value: 0
      source: s6
      scope: >
        Counting investigations, penalties, and comparable-case citations tied to
        the 12 June directive. The set is closed and empty. The Legion LegalTech
        suit is excluded: it runs against the order rather than amplifying it.
      note: >
        No investigation, penalty, or comparable-case citation followed. Window is
        the eighteen days to the lifting plus the period since.
  narrative:
    financial_exposure:
      text: >
        No figure published. What is documented is the shape rather than the size:
        enterprise clients across finance, healthcare, SaaS, and critical
        infrastructure lost a live service without notice or recourse, and the
        argument that carried weight in reversing the order was competitive rather
        than contractual, that the freeze advantaged rivals abroad.
      basis: reported
      source: s6
    downstream_reach:
      text: >
        Six named distribution platforms and everything built on them, plus
        national security users of the Mythos build. Beyond the named enterprises
        the affected population is every user of a model on general release,
        which cannot be enumerated.
      source: s2

# --- Deviations --------------------------------------------------------------
deviations:
  - id: D8
    field: layer_d distribution.bearer_type
    observed: >
      The burden fell simultaneously on identifiable firms with contracts, on a
      federal agency, and on an unbounded population of public users.
    why_it_does_not_fit: >
      bearer_type is exactly_one. The value was added after the EU watermarking
      case on the assumption that a bearer is either nameable or diffuse. A case
      can be both, and here the two groups had different recourse: the enterprises
      had contracts to point at, the public users had nothing.
    workaround: Recorded as a list. The field may need to become multi-select.
    resolved_in: r6
    resolution: bearer_type changed from exactly_one to one_or_many.

  - id: D9
    field: measured.numeric.deadline_gap
    observed: >
      Zero. The order was effective on receipt with no notice period at all.
    why_it_does_not_fit: >
      Across three cases the field has now produced three different shapes: a gap
      that could not be measured because no gate was published, a gap running the
      wrong way because the operative date fell later than the announced one, and
      zero because there was no interval to measure. The definition assumes an
      interval exists and runs one way.
    workaround: >
      Recorded as 0. Reinforces D6 (anthropic-dow-2026). The field needs either a
      direction or a companion field saying which kind of gap it is.
    resolved_in: r6
    resolution: deadline_gap now carries a required shape; this case is no_gate.

