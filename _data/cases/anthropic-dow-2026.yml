id: anthropic-dow-2026
title: Anthropic supply chain risk designation
status: draft
period: { from: 2025-07, to: }
jurisdiction: [US]
actors:
  - name: Anthropic PBC
    role: Contractor. Designated. Plaintiff in two suits.
  - name: US Department of War (formerly Defense)
    role: Contracting agency. Made the designation.
  - name: Pete Hegseth
    role: Secretary. Issued the ultimatum, the social-media post, and the 3 March letter.
  - name: Emil Michael
    role: Under Secretary for Research and Engineering. Authored the risk-analysis memo of 2 March.
  - name: Rita Lin
    role: US District Judge, Northern District of California. Granted the preliminary injunction.
  - name: Palantir
    role: Prime contractor through which Claude reached classified networks.
  - name: Treasury, State, and other federal agencies
    role: Named in the suit after ordering staff to stop using Claude.
  - name: Third-party defence contractors
    role: Covered by the secondary restriction as announced, not as written in the formal letters.

# --- Layer A, Classification ---------------------------------------------------
layer_a:
  object_type: relational
  object_note: >
    The contested object is the procurement and supply-chain relationship through
    which Claude reaches government systems, not a good or a dataset. The parties
    are plainly identifiable and the scope of the tie is not: whether the
    designation reaches contractors doing unrelated business with Anthropic was
    argued at length and is still unsettled.

  instability_conditions:
    - id: object_opacity
      side_a: an object that cannot be opened and checked against a specification
      side_b: a procurement regime built to verify what it buys
      note: >
        The government's stated ground is that frontier AI is opaque by nature,
        that it cannot be taken apart the way a rifle can, and that every model
        update is a fresh opportunity for an undisclosed guardrail. The judge put
        drones to them as a comparison and the government answered that AI differs
        fundamentally from hardware and from ordinary software alike. None of the
        three existing conditions covers this: each of those needs two things to
        hold between, and this is a property of the object on its own.
    - id: category_practice_mismatch
      side_a: supply chain risk as the statutes define it
      side_b: a domestic contractor in a policy disagreement
      note: >
        The designation is an instrument built for foreign-linked suppliers and had
        not been used against a US company before. Anthropic's own filing calls the
        action unprecedented.

  conditions_blank_reason:

# --- Layer B, Formation history -------------------------------------------------
layer_b:
  event_type: dispute
  formation_trace:
    summary: >
      Traced backward from the summary-judgment hearing. What is being decided is
      not whether Anthropic crossed a line but whether the lines were lawfully
      drawn, and there is more than one. Four measures run together: a
      presidential directive to all federal agencies, a departmental directive, a
      supply-chain risk designation under 10 USC 3252 reaching department
      procurement, and a separate designation under 41 USC 4713 reaching federal
      acquisition more broadly. The first three are before the Northern District
      of California; the fourth is before the DC Circuit. They have not moved
      together. The remedy argument in the district court is explicitly about
      whether the designation gets erased or redrawn: vacate and remand against
      remand without vacatur.
    order_began_operating: 2026-03-03
    order_began_operating_note: >
      Three dates sit close together and mean different things. The political
      directives issued on 27 February; the formal designation letters carry
      3 March; Anthropic is reported to have been notified on 4 March. Recorded
      at the letter date, with the others in the markers.
    markers:
      - { date: 2024-07, note: "Palantir announces the partnership bringing Claude into government intelligence and defence work. Date contested: the Anthropic, Palantir and AWS partnership is widely reported as announced in November 2024", source: s1 }
      - { date: 2025-07, note: "$200m contract with the department, with acceptable-use terms excluding mass domestic surveillance and fully autonomous weapon systems, meaning systems that can select and engage targets without further human intervention after activation. Human-supervised and human-in-the-loop systems are a separate category under DoD Directive 3000.09 and are not what the restriction addressed", source: s1 }
      - { date: 2026-01-03, note: reporting that the technology was used in the Maduro operation, source: s2 }
      - { date: 2026-02-24, note: department demands agreement to all lawful uses, source: s2 }
      - { date: 2026-02-27, note: "the ultimatum expires; a presidential directive to all federal agencies to cease all use of Anthropic's technology follows, citing no statutory authority, and then the Secretary's directive. The interval between them is given differently in different accounts and is not recorded as a figure here. Six-month phase-out announced", source: s2 }
      - { date: 2026-03-02, note: Under Secretary's risk-analysis memo, produced after the directives, source: s5 }
      - { date: 2026-03-03, note: formal designation letters, one under 10 USC 3252 and one under 41 USC 4713, source: s5 }
      - { date: 2026-03-04, note: Anthropic reported as formally notified that use of its products in covered procurements presented a supply chain risk, effective immediately, source: s8 }
      - { date: 2026-03-09, note: "two suits filed on the two statutes. The ND Cal complaint at 3:26-cv-01996 pleads five counts: APA violations, First Amendment retaliation, ultra vires executive action, Fifth Amendment due process, and further APA sanction violations. A petition for review is docketed the same day in the DC Circuit at No. 26-1049", source: s3 }
      - { date: 2026-03-12, note: court sets a briefing schedule for amicus briefs on the preliminary injunction motion, source: s3 }
      - { date: 2026-03-26, note: "preliminary injunction granted by Judge Rita F. Lin, enjoining the three challenged actions before that court, the presidential directive, the departmental directive, and the 10 USC 3252 designation, and restoring the position as of 27 February. It does not require any agency to use Claude and does not reach the 41 USC 4713 designation, which was before the DC Circuit. Nominal bond and a seven-day administrative stay expiring 2 April. Likelihood of success found on First Amendment retaliation and on Fifth Amendment grounds. The 43-page length, the bond figure, and the grounds are taken from secondary accounts", source: s6 }
      - { date: 2026-04-08, note: "DC Circuit denies Anthropic's motion for a stay in the parallel challenge to the 41 USC 4713 designation. That designation stays in place. How far this displaces the practical effect of the district court's injunction is contested and turns on which measure is at issue", source: s9 }
      - { date: 2026-05-19, note: DC Circuit hears oral argument on the parallel petition, having granted expedition, with supplemental briefing ordered through 4 June, source: s7 }
      - { date: 2026-05, note: the government's interlocutory appeal of the preliminary injunction is held in the Ninth Circuit pending the DC Circuit's resolution of the parallel petition, source: s7 }
      - { date: 2026-07-30, note: hearing on cross-motions for summary judgment; taken under submission, source: s5 }
      - { date: 2026-08-30, note: agency pilot programmes slated to expire, per the government at the hearing, source: s5 }
      - { date: 2026-09-30, note: department wind-down of Anthropic products scheduled to complete, per the government at the hearing, source: s5 }

# --- Layer C, Manifestation (merged r4 firm_traces + transmission_channels) -----
layer_c:
  manifestation:
    - id: boundary_drift
      note: >
        Who the designation covers moved, and it moved between three descriptions
        of the same measure rather than between two dates. The public announcement
        described no contractor, supplier, or partner doing business with the US
        military being able to deal with Anthropic. The formal letters are
        narrower. The government's own reading at the hearing was narrower again,
        reaching customers using Claude as a direct part of a department contract
        rather than commercial dealings generally. All three remain in the record,
        and the government would not give the court a categorical answer on the
        widest version. The gap between announcement, instrument, and litigation
        position is the drift.
    - id: definitional_contest
      note: >
        Two statutes, two courts, two readings. The department invoked 10 USC 3252
        and 41 USC 4713 at about the same time, and there are two suits, which have
        not moved together.

        Separately, and this is the substantive contest, the dispute is not over
        what the department was doing with Claude. It is over whether Anthropic
        could keep contractual restrictions on two categories while the department
        required access for all lawful purposes, including uses not yet arisen. A
        department spokesman said publicly that mass domestic surveillance is
        unlawful and that it had no interest in fully autonomous weapons. What the
        phrase all lawful purposes would foreclose is a restriction held against
        future use, and that is what was refused.
    - id: competing_clocks
      note: >
        The wind-down runs on a fixed schedule while the litigation that could void
        the designation runs on its own. Related: the directives issued on
        27 February, the risk-analysis memo supporting them is dated 2 March.
    - id: classification_decision
      note: the designation is the order. Being placed in the category is the whole of what reached the firm
    - id: deadlines
      note: "wind-down completing 30 September, pilots expiring 30 August, both stated to the court rather than published"
    - id: contractual_relations
      note: >
        Anthropic's model-use restrictions operated as a term or a practical
        condition of the procurement relationship, so a policy disagreement became
        a contract disagreement and then a security designation. What was written
        into the contract and what was general commercial usage policy are not
        separated in the sources held.
    - id: supply_chain_position
      note: several agencies reached Claude through third-party cloud providers rather than directly, which the government argued put those decisions beyond review
    - id: access_restriction
      note: federal staff directed to stop using the product; two agencies paused contracts

# --- Layer D, Distribution -------------------------------------------------------
layer_d:
  distribution:
    source: >
      The department, as the actor producing the designation. Anthropic is the
      source of the capability but not of the order.
    bearer: >
      Anthropic. Under the restriction as announced the bearers would also include
      contractors with no connection to the department's own systems, which is
      what the court pressed the government on and what it would not answer
      categorically. Whether the instruments carry that reach is the disputed
      point, not an established one.
    bearer_type: firm
    leverage: contested
    mechanisms:
      - { id: burden_displacement, note: the announced secondary restriction would land on third parties who neither held the contract nor said anything. Its legal reach is contested and the government declined to state it categorically }
      - { id: downstream_propagation, note: reached agencies with no direct contractual relationship, including some using Claude through cloud vendors }
      - { id: enforcement_amplification, note: the designation itself did not change, but directives spread from the department to the whole federal government, and agencies beyond the department ordered staff to stop. See the measured note on why this is not counted }

# --- Layer E, Re-formation ---------------------------------------------------------
layer_e:
  reformation:
    responses: [contract_rewriting, lobbying]
    sources: [s3, s5]
    narrative: >
      Anthropic litigated rather than complied, filing two suits eleven days after
      the directives and winning a preliminary injunction in the district court.
      It did not win everywhere: the DC Circuit declined to stay the 41 USC 4713
      designation, so the two measures stood in different postures and the
      practical effect of the injunction became a contested question rather than a
      settled one. Anthropic says it built a government-specific deployment so
      that the guardrail problem the department cites from the CDC example would
      not arise; the nature of that deployment is not established in the sources
      held. It has kept supplying the department at nominal cost during the
      wind-down. On the other side, procurement is reported to have moved quickly
      toward competing providers, but the identity of the provider, the value and
      legal status of any replacement contract, and whether it displaced an
      existing one are not recorded here. Nothing in the record shows the
      designation itself withdrawn.
    contextual_amplification: []

# --- Measured fields ---------------------------------------------------------
measured:
  numeric:
    deadline_gap:
      value: 34
      shape: gate_after_formal
      source: s5
      note: >
        Announced six-month phase-out from 27 February lands about 27 August. The
        department told the court the wind-down completes 30 September. Sign is
        inverted against the field definition, see D6.
    time_to_response: { value: 10, source: s3, note: "directives 2026-02-27, suits filed 2026-03-09" }
    enforcement_amplification_events:
      value: null
      scope: >
        Not counted. The filings name agencies including Treasury and State, so
        the set is open and any figure would be a floor. See D7.
  narrative:
    financial_exposure:
      text: >
        The department contract was worth up to $200 million against company
        revenue reported at a far higher order of magnitude, so the direct contract
        loss is small. What the filings put at issue instead is the designation
        itself, which Anthropic calls stigmatising and unprecedented against a US
        company. No figure has been placed on that.
      basis: reported
      source: s4
    downstream_reach:
      text: >
        Federal agencies beyond the department, named in the suit as including
        Treasury and State. Two agencies paused contracts. Third-party defence
        contractors were covered by the boycott as announced but not as written.
        The record says including rather than listing, so the set is open.
      source: s3

# --- Deviations --------------------------------------------------------------
deviations:
  - id: D5
    field: layer_a instability_conditions
    observed: >
      The government's central ground is that the object cannot be inspected: not
      like a rifle, not like ordinary software, and different again at every model
      update.
    why_it_does_not_fit: >
      None of the three existing values covers an object that resists definition
      because it cannot be opened. Jurisdictional overlap needs two authorities,
      speed mismatch needs two cycles, category-practice mismatch needs a category
      and a practice. This is a property of the object on its own.
    workaround: Recorded as object_opacity and flagged as a new value under R6.
    resolved_in: r6
    resolution: >
      Registered as a fourth instability condition after the same shape appeared
      in fable-mythos-2026 and claude-watermarking-2026. See schema open_questions Q4.

  - id: D6
    field: measured.numeric.deadline_gap
    observed: >
      The announced horizon was six months from 27 February. The operative
      completion date given to the court is 30 September, which is later.
    why_it_does_not_fit: >
      The field is defined as the formal effective date minus the actual
      preparation gate, on the assumption that the real gate falls earlier than the
      formal one. Here it falls later, so the value is positive for the opposite
      reason and is not comparable with a gap measured the usual way.
    workaround: Recorded as 34 with the sign noted. The field may need a direction.
    resolved_in: r6
    resolution: deadline_gap now carries a required shape; this case is gate_after_formal.

  - id: D7
    field: measured.numeric.enforcement_amplification_events
    observed: >
      Directives spread from one department to the whole federal government, and
      the filings name agencies including Treasury and State.
    why_it_does_not_fit: >
      The word including means the set is open, so any count is a floor rather than
      a measurement. This is the case the field's own selection rule was meant to
      exclude.
    workaround: Left null. The spread is recorded in narrative form instead.
    resolved_in: r6
    resolution: enforcement_amplification_events now requires a counting scope, and is null where the set is open.

