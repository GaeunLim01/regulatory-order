# Case schema. Released as Framework v1.0.
# Controlled vocabulary. Single source of truth for enum values.
# Editing the framework pages without editing this file is the drift to avoid.

release_version: "1.0"
revision: r6
version_note: >
  The release version identifies the current public vocabulary. The five layers are
  parallel analytical layers. They are not a process sequence, and no layer may be
  inferred from or used to suppress another layer. Revision history is maintained
  as internal provenance rather than as the research architecture.

# Two kinds of blank. They must not collapse into one representation.
sentinels:
  null:
    meaning: The field applies to this case, but the documentary record does not settle it.
    render: "not documented"
  not_applicable:
    meaning: The branch never reaches this question. Produced only by event_type = enactment.
    render: "—"

# --- Layer A, Classification (qualitative only) ------------------------------
# What kind of thing this is, structurally. Holds regardless of whether any
# dispute occurred — that question belongs to Layer B.
layer_a:
  object_type:
    cardinality: exactly_one
    required: true
    values:
      - { id: capability,     label: Capability }
      - { id: access_data,    label: Access & data }
      - { id: physical_goods, label: Physical goods, exercised: false }
      - { id: relational,     label: Relational }

  instability_conditions:
    cardinality: zero_or_many
    required: false         # blank is allowed, but must carry conditions_blank_reason (R3)
    always_considered: true # never skipped because of the Layer B value, see N1
    values:
      - { id: jurisdictional_overlap, label: Jurisdictional overlap, sides_required: true }
      - { id: speed_mismatch,         label: Speed mismatch,         sides_required: true }
      - { id: object_opacity, label: Object opacity, sides_required: true }
      - { id: category_practice_mismatch, label: Category-practice mismatch, sides_required: false }
    sides:
      fields: [side_a, side_b]
      note: >
        Write out both sides. The semiconductor corpus could omit them because one
        side never varied (U.S. jurisdiction; legislative cycle). That constant does
        not survive contact with non-U.S. orders.

# --- Layer B, Formation (qualitative only) -----------------------------------
# How this instance's boundary came to take its current shape. Independent of
# Layer A: an Enactment can still carry a full set of Layer A conditions (the
# Article 50 watermarking case is the proof — see non_rules N1).
layer_b:
  event_type:
    cardinality: exactly_one
    required: true
    structure: two_step_branch
    values:
      - id: enactment
        label: Enactment
        step: 1
        exits_at_step_1: true
      - id: dispute
        label: Dispute
        step: 2
        direct_opposition: true
        timeline_marks: Points where actors came into direct opposition.
      - id: amendment
        label: Amendment
        step: 2
        direct_opposition: false
        timeline_marks: The path along which burden arises after the amendment.

  formation_trace:
    required_when: event_type in [dispute, amendment]
    not_applicable_when: event_type == enactment
    fields:
      summary: Prose, traced backward from the present.
      markers: Dated points. Meaning depends on event_type.
      order_began_operating: Date the order began operating.

# --- Layer C, Manifestation ----------------------------------------------------
# A parallel layer for the manifestations recorded in the case. It is not defined
# as a consequence of Layer A or Layer B; it records which manifestations are
# present in the case record.
layer_c:
  manifestation:
    cardinality: zero_or_many
    note: A case may carry several manifestation values. They are recorded alongside the other layers.
    values:
      # formerly module_1.firm_traces
      - { id: boundary_drift,       label: Boundary drift,       origin: firm_trace }
      - { id: definitional_contest, label: Definitional contest, origin: firm_trace }
      - { id: competing_clocks,     label: Competing clocks,     origin: firm_trace }
      - { id: recurring_reset,      label: Recurring reset,      origin: firm_trace }
      # formerly module_3.transmission_channels
      - { id: classification_decision, label: Classification decision, origin: transmission_channel }
      - { id: deadlines,               label: Deadlines,               origin: transmission_channel }
      - { id: contractual_relations,   label: Contractual relations,   origin: transmission_channel }
      - { id: documentation_systems,   label: Documentation systems,   origin: transmission_channel }
      - { id: supply_chain_position,   label: Supply-chain position,   origin: transmission_channel }
      - { id: access_restriction,      label: Access restriction,      origin: transmission_channel }
    origin_note: >
      `origin` is kept only as a migration breadcrumb back to the r4 field a
      value came from. It carries no rule and should not be read as two lists
      wearing one label — that is exactly the distinction r5 collapsed.

# --- Layer D, Distribution -----------------------------------------------------
# Positions, bearer characteristics, leverage, and mechanisms recorded for the
# case. This is a parallel analytical layer, not a downstream stage.
layer_d:
  distribution:
    positions:
      source: Actor producing the underlying capability, asset, demand, or regulatory trigger.
      bearer: Actor standing where the order actually produces consequences.
      note: Relational positions, not fixed identities. Recorded per order, never per actor.
    bearer_type:
      cardinality: one_or_many
      values:
        - { id: firm,    label: Identifiable, nameable }
        - { id: diffuse, label: Unbounded population of individuals; cannot be enumerated }
      note: >
        Was exactly_one until r6. Two cases carried both at once, with the two
        groups holding different recourse: named firms had contracts to point at
        and the diffuse population had nothing. Where both are recorded, say in
        `bearer` which group holds what. See deviations D8.
    leverage:
      cardinality: zero_or_one
      values: [low, contested, high]
      note: Qualitative. Do not score.
    mechanisms:
      cardinality: zero_or_many
      values:
        - { id: burden_displacement,      label: Burden displacement }
        - { id: downstream_propagation,   label: Downstream propagation }
        - { id: enforcement_amplification, label: Enforcement amplification }

# --- Layer E, Re-formation ------------------------------------------------------
# Re-formation responses and contextual amplification recorded for the case.
# This layer does not imply a required feedback path into Layer B.
layer_e:
  reformation:
    cardinality: zero_or_many
    values: [supply_chain_restructuring, product_redesign, contract_rewriting,
             jurisdictional_relocation, lobbying, new_intermediaries]
    contextual_amplification:
      note: >
        External shocks, war, sanctions realignment, currency shock, political
        turnover, financial crisis. Distinct from firms' own adaptation because it
        originates outside the field the order governs. Recorded here as a contextual
        condition; it does not define a required relationship with another layer.

# --- Measured fields (template 4c) -------------------------------------------
# Numeric only where two fixed points in the record determine the value.
# Anything requiring a judgment about where to stop counting measures reporting
# density, not the phenomenon.
measured:
  numeric:
    shape: { value: <number>, source: <source_id> }
    fields:
      - id: deadline_gap
        unit: days
        points: Formal effective date ↔ actual preparation or compliance gate.
        shape_required: true
        shape:
          values:
            - { id: gate_before_formal, label: Operative gate falls before the formal date }
            - { id: gate_after_formal,  label: Operative date falls after the announced horizon }
            - { id: no_gate,            label: Effective on receipt; no interval to measure }
            - { id: two_formal_dates,   label: Two statutory dates for the same duty; neither is a gate }
            - { id: not_applicable,     label: No order in force }
          note: >
            Added in r6. The field was defined for the first shape and produced
            four across five cases, so the number alone does not say what was
            measured. A value without a shape is not readable. See deviations
            D6, D9, D12.
      - id: time_to_response
        unit: days
        points: Order taking effect ↔ first documented firm response.
      - id: enforcement_amplification_events
        unit: count
        points: Original order ↔ subsequent investigations, penalties, comparable-case citations.
        scope_required: true
        scope:
          record: >
            State what is being counted and what is excluded, in one line, before
            giving a number. Two conditions must hold or the field is null with
            the reason in the note. First, the set must be closed: a filing that
            names agencies "including" some list leaves it open and any count is
            a floor. Second, the events must belong to the same order: a separate
            proceeding under different law over overlapping conduct is convergent
            enforcement, not amplification of one order.
          note: Added in r6. See deviations D4 and D7, and supermicro D2.

  narrative:
    shape: { text: <string>, source: <source_id> }
    fields:
      - id: financial_exposure
        record: Cost, fine, or revenue loss. State whether reported, estimated, or modeled.
      - id: downstream_reach
        record: >
          Parties the burden propagated to. Name them where identifiable; where the
          bearer is diffuse, describe its character instead of counting.

  dropped_in_v4:
    documentation_burden: No counting rule.
    concurrent_order_load: Value depends on how wide "the same actor" is drawn.
    time_to_normalization: Broke on first application; required staged recording.
    contextual_amplification_events: Counts co-occurrence; widen the window and it grows.

# --- Validation rules --------------------------------------------------------
rules:
  - id: R1
    rule: >
      event_type == enactment → the formation_trace summary must not plot a
      dispute timeline, because there was none. It may still carry markers where
      the order's own passage into effect, and its arrival at the parties who
      bear it, are dated in the record. Where neither exists, record
      `not_applicable`, never null.
    why: >
      Enactment exits the branch at Step 1, and its blank is not missing data.
      Narrowed in r6: the original rule collapsed the whole block, which
      discarded documented dates in two cases for the sake of a timeline that was
      never at issue. What R1 excludes is a fabricated dispute history, not a
      trace. See deviations D10 and D13.
  - id: R2
    rule: event_type in [dispute, amendment] → formation_trace must not be `not_applicable`.
  - id: R3
    rule: >
      instability_conditions blank → `conditions_blank_reason` must say why.
      The case is still valid. A blank is an observation, not a failure.
    why: >
      These are conditions, not events. They hold whether or not anyone came into
      opposition, so a blank is worth explaining rather than forbidding. The
      explanation is what later shows whether the vocabulary is too narrow.
      What must never happen is a blank *because* Layer B says enactment.
      That would let Layer B determine Layer A. See N1.
  - id: R4
    rule: Any non-null measured value must carry a `source` id present in `sources`.
  - id: R5
    rule: >
      jurisdiction is not US and instability_conditions includes jurisdictional_overlap
      or speed_mismatch → write out the sides. Where the case has more than two, or
      where a party's legal hook attaches to something other than the object, record
      it in `deviations` rather than forcing it into the pair.
  - id: R6
    rule: >
      Unknown enum values are flagged, not rejected. They render with a marker and
      are listed on the case. The build does not fail.
    why: >
      This is a framework for reading cases, not a form cases must fit. A value that
      does not exist yet is the most informative thing a case can produce; failing the
      build on it would discard exactly the signal the library is being built to catch.
      Vocabulary changes are made in batches once several cases are in, never one case
      at a time, otherwise the framework ends up shaped by whichever case came last.
  - id: R7
    rule: status == complete → every layer_a and layer_b required field is non-null.

# --- Open questions ----------------------------------------------------------
# Questions about the framework itself that argument cannot settle and tagging can.
# Each carries the observation that would decide it. Distinct from `deviations`:
# a deviation is one case failing to fit the vocabulary, an open question is a
# doubt about whether two parts of the vocabulary are doing separate work at all.
open_questions:
  - id: Q1
    question: >
      Do 1.3 firm traces (Layer A in r4) and 3.1 transmission channels (Layer D
      in r4) describe separate things, or has the same phenomenon been given
      two names?
    status: resolved_in_v5
    resolution: >
      Merged into layer_c.manifestation. Across all three registered cases the
      firm-trace pair and the classification_decision channel fired together
      every time and never once separated — 3 for 3. Kept as one history note
      here rather than deleted, since the evidence trail is what justified the
      change.
    evidence:
      - case: supermicro-2026
        result: >
          Does not separate on the classification pair. 3.1 classification_decision
          and 1.3 boundary_drift both fire. But the deadlines pair does separate:
          1.3 competing_clocks fires and 3.1 deadlines does not, because no
          preparation gate is documented for this order while the shipment dates
          still run against a rule being revised.
      - case: anthropic-dow-2026
        result: >
          Classification pair fires together again, second time in a row. The
          deadlines pair fires together here too.
      - case: fable-mythos-2026
        result: >
          Classification pair together, three for three. Standing count: the
          classification pair never separated across the library, which is
          what decided the merge.

  - id: Q2
    question: >
      Is an enforcement action its own Layer B event, or a Layer D observation
      attached to the case for the rule being enforced?
    overlap: >
      Layer B asks how the boundary reached its current shape. A prosecution
      enforces a boundary rather than forming one, yet enforcement here is visibly
      changing the boundary: a second jurisdiction is weighing legislation in
      response, and firms are redesigning products around it.
    decides_it: >
      Whether the enforcement cases in the library produce formation traces that
      differ from the traces of the rules they enforce. If they duplicate, they
      are Layer D observations.
    status: resolved_in_current
    resolution: >
      Under the current framework, enforcement may be recorded in Layer B and/or
      Layer D as warranted by the case. The layers are parallel and the framework
      does not require enforcement to be attached to a prior layer as a consequence.
    evidence:
      - case: anthropic-dow-2026
        result: >
          Points toward Layer B. The court is not deciding whether the firm crossed
          a line but whether the line was lawfully drawn, and the remedy argument is
          openly about erasing it against redrawing it: vacate and remand against
          remand without vacatur. That is formation, not transmission. It does not
          settle the Super Micro case, where a prosecution enforces a boundary
          nobody is contesting the drawing of.
      - case: fable-mythos-2026
        result: >
          Points toward Layer B, and harder than the previous case. There was no
          published rule requiring a licence for foreign-national access to a
          frontier model. The directive created the obligation, the eighteen-day
          standoff set its terms, and the lifting letter recorded the settlement.
          Enforcement and formation are the same event here, so treating the
          directive as a Layer D observation on some prior order would leave
          nothing to attach it to.

  - id: Q4
    question: >
      Is object opacity a fourth instability condition, or a species of one already
      in the list?
    overlap: >
      Raised by anthropic-dow-2026, where the government's stated ground is that
      frontier AI cannot be inspected against a specification the way hardware can,
      and that every update reopens the question. The three existing values each
      need two things to hold between: two authorities, two cycles, or a category
      and a practice. This one is a property of the object on its own.
    decides_it: >
      Whether it recurs. Check it against the Fable 5 release case and the EU
      watermarking case, both of which turn on what can be known about a model from
      outside it. Recurrence across cases makes it a value; a single appearance
      makes it a feature of this dispute.
    status: resolved_in_v6
    resolution: >
      Registered as a fourth instability condition. Three independent
      appearances, in three disputes with no actor, statute, or object in
      common. The common core is that the property at issue shows only in
      behaviour, so no inspection settles it and the evidence about it sits with
      one party. What differs between the three is only the counterpart it is
      held against.
    evidence:
      - case: anthropic-dow-2026
        result: >
          First appearance. The government's ground for the designation is that
          frontier AI cannot be checked against a specification and that every
          update reopens the question.
      - case: fable-mythos-2026
        result: >
          Second appearance, and in a dispute with nothing else in common with the
          first: different agency, different statute, different object, no
          contract at issue. The whole standoff is over whether a reported bypass
          was severe enough to control, and it ends without anyone settling that.
          The settlement is an undertaking about process rather than a finding
          about the model.
      - case: claude-watermarking-2026
        result: >
          Third appearance, and the one that decided it. An earlier version of
          this case recorded object_opacity against the durability of marking
          schemes, which is a different problem and would have registered the
          value on the wrong fact. What the case actually shows is that the
          provider states the mark does not change meaning, quality, or
          readability and carries no identifying information, and has not
          published the implementation, so no user can check either claim. Same
          structure as the other two: a behavioural property, evidence held by
          one side.
    note: >
      Registered in r6. The value covers a property of the object alone, which
      is what separates it from the other three: those each need two things to
      hold between, two authorities, two cycles, or a category and a practice.

non_rules:
  - id: N1
    statement: >
      No rule may make any layer depend on another layer. The five layers are
      parallel analytical layers. If a correlation appears in the data, that is a
      finding, not a constraint. A case may be rich in one layer and sparse in
      another without the layers becoming conditionally linked.
  - id: N2
    statement: >
      Layer A and Layer B carry no numeric fields, and none may be added.
      Scoring a classification judgment manufactures false precision.

# --- Deviations --------------------------------------------------------------
# Where a case does not fit the vocabulary, the case is right and the vocabulary
# is provisional. Record the misfit here rather than stretching a value to cover
# it or inventing one on the spot.
deviations:
  cardinality: zero_or_many
  shape:
    field: Which field or rule the case strained (e.g. "layer_a instability_conditions", "R5").
    observed: What the case actually shows.
    why_it_does_not_fit: The specific way the current definition fails to cover it.
    workaround: How it was recorded in the meantime. Optional.
    resolved_in: Framework version that acted on it. Absent while still open.
    resolution: What changed. Required with resolved_in.
  review:
    note: >
      Reviewed in batches, never per case. A deviation appearing once is a property
      of that case. The same deviation across two or more cases is a property of the
      vocabulary, and only then is the vocabulary changed. Q1's merge into layer_c
      is the first change made this way.
    open: [D1, D2, D3, D11, D14]   # one appearance each; not yet a property of the vocabulary
    resolved:
      - deviation: Q1
        framework_version: r5
        change: merged module_1.firm_traces and module_3.transmission_channels into layer_c.manifestation
      - deviation: [Q4, D5]
        framework_version: r6
        change: registered object_opacity as a fourth instability condition
      - deviation: D8
        framework_version: r6
        change: bearer_type from exactly_one to one_or_many
      - deviation: [D6, D9, D12]
        framework_version: r6
        change: deadline_gap gains a required shape, since the number alone did not say what was measured
      - deviation: [D4, D7]
        framework_version: r6
        change: enforcement_amplification_events gains a required counting scope, and is null where the set is open or the events belong to another order
      - deviation: [D10, D13]
        framework_version: r6
        change: R1 narrowed to exclude a fabricated dispute history rather than the whole formation_trace block
    still_open_note: >
      D1 (three claimants where sides is a pair), D2 (convergent enforcement
      under non-equivalent law), D3 (re-formation in a different jurisdiction
      from the one that formed the order), D11 (event_type against an
      uncontested vote), and D14 (a response that preceded its trigger) have one
      appearance each. Each is recorded and none is acted on.

sources:
  shape:
    id: s1
    kind: statement | press | filing | rule | statute | industry_comment
    citation: >-
      Enough to locate the document. For press, name the outlet, the headline, and
      the date. "Reporting on X" is not a citation and does not survive review.
    url: Optional. Present where the document is public and stable.
    date: <date>
    verified:
      status: confirmed | unlocatable | contradicts | pending
      checked: <date>
      note: Required for unlocatable and contradicts. Optional otherwise.
  note: >
    `pending` is the default and means nobody has looked. `unlocatable` means someone
    looked and did not find it, which is a different thing and has to be readable as
    such. `contradicts` means the source exists and does not support what the case
    says it supports.
  rule: >
    A note resting on a source marked unlocatable or contradicts is a candidate for
    removal, not a claim the case can make. Marking the source is the first step and
    does not by itself fix the note.

case_status:
  values: [draft, complete]
  file_location: >
    Case files live in _data/cases/ and nothing else does. Jekyll reads that directory
    recursively, so any stray YAML there is loaded as a case. The blank template is
    kept at docs/case-template.yml for this reason.
  note: draft cases render in the library but are excluded wherever cases are counted.
