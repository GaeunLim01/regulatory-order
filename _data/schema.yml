# Current analytical frame
#
# Three parallel lenses. Each is guided by an open question rather than a
# fixed set of required sub-fields. Cases may use each lens at different depth.
#
# A higher-level cross-case pattern — the Regulatory Order Cycle — sits above
# the lenses and is not a mandatory case template.

ordering:
  note: >
    How regulatory order is configured and changes over time. Focus on
    jurisdictional or use boundaries, their lineage, and points of strain
    or reconfiguration.
  open_question: >
    How is the jurisdictional or use boundary of this order drawn, and where
    is it tested, strained, or reconfigured?

manifestation:
  note: >
    How the order becomes operational in concrete instruments and mechanisms,
    and where design meets value-chain or enforcement limits.
  open_question: >
    Through what instruments does the order operate, and where do operational
    limits or gaps between design and value-chain realities appear?

distribution:
  note: >
    How norms, information, documents, authority, and burdens move across
    actors. Information asymmetry and responsibility allocation are central.
  open_question: >
    How do informational requirements and responsibility burdens created by
    this order move across actors?

cycle:
  note: >
    Cross-case pattern only. Not a required case field. Stages: technological
    change → category mismatch → boundary-setting → transmission → field
    application → breakdowns → visible limits → reconfiguration.

case_character:
  note: >
    Optional analytical output (e.g. dispute, amendment, enactment). Not a
    universal event taxonomy.

method_note:
  statement: >
    The frame is provisional. A case may expose a distinction that requires
    revision of the shared vocabulary; the case is not required to fit a
    pre-fixed taxonomy.
