# Current analytical frame
#
# Not a fixed model with named stages. Three questions recur across cases,
# in roughly this order of attention, each guided by an open question rather
# than a required set of sub-fields. A case may answer one at length and
# another in a sentence — see docs/case-template.yml for the drafting prompts.

design_vs_interpretation:
  note: >
    Who wrote the operative categories in general terms (usually a
    legislature, usually before the case's situation existed), and who —
    an agency, a regulator, a company reading its own obligations — only
    gets to rule on whether a new situation fits inside them.
  open_question: >
    What body designed the categories this case rests on, and what
    different body only interprets them?

the_gap:
  note: >
    Where the design/interpretation split above left something new enough
    that nobody had built a category for it yet.
  open_question: >
    What about this technology or use sits outside every existing category,
    and since when?

actors:
  note: >
    The one that usually earns the most space on a case page — a per-actor
    table (what they meant to do / what happened instead) works better here
    than a single paragraph.
  open_question: >
    For each actor moving into the gap: what did they mean to do, and what
    happened instead? Who ends up carrying a difference they didn't sign
    up for?

case_character:
  note: >
    Optional, loose observation that doesn't need to be forced into one of
    the three questions above.

method_note:
  statement: >
    The frame is provisional. A case may expose a distinction that requires
    revision of the shared vocabulary; the case is not required to fit a
    pre-fixed taxonomy.
