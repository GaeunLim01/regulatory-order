# Case template — current analytical frame
# Case-specific content is intentionally open. These are prompts for drafting,
# not fields to fill in mechanically — a case may answer one at length and
# another in a sentence.

id:
title:
status: draft
regulatory_subject:

# 1. Who designed the categories this rests on, and who only interprets them?
design_vs_interpretation:
  open_question: >
    What body wrote the operative categories in general terms, usually before
    this situation existed? What different body only gets to rule on whether
    a new situation fits inside them?
  notes:

# 2. Where did that split leave a gap nobody had designed for?
the_gap:
  open_question: >
    What about this technology or use sits outside every existing category,
    and since when?
  notes:

# 3. What did each actor do into that gap, and where did intent and outcome
#    come apart? (This is the one that usually earns the most space — a
#    per-actor table works better here than a single paragraph.)
actors:
  open_question: >
    For each actor: what did they mean to do, and what happened instead? Who
    ends up carrying a difference they didn't sign up for?
  notes:

# Optional case-level characterization — a loose observation that doesn't
# need to be forced into one of the three questions above.
case_character:
